<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .search-container {
            background-color: #f1f3f4;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.05);
            z-index: 10;
        }

        input[type="text"] {
            flex-grow: 1;
            min-width: 0;
            padding: 8px 14px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            background-color: white;
        }

        input[type="text"]:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
        }

        button {
            padding: 8px 18px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background-color: #1a73e8;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: #1557b0;
        }

        button:disabled {
            background-color: #aeb4bd;
            cursor: not-allowed;
        }

        #status {
            margin: 0;
            font-size: 12px;
            color: #666;
            white-space: nowrap;
        }

        iframe {
            flex-grow: 1;
            width: 100%;
            min-height: 0;
            border: none;
            background-color: white;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="search-container">
        <button id="backButton" onclick="goBack()" title="Go back" disabled>
            ←
        </button>

        <input
            type="text"
            id="targetUrl"
            placeholder="Enter URL (e.g., https://example.com)"
            onkeydown="if(event.key === 'Enter') previewHtml()"
        >

        <button onclick="previewHtml()">Go</button>

        <p id="status"></p>
    </div>

    <iframe id="previewFrame" title="Website Preview"></iframe>

    <script>
        // Your original Google Apps Script API URL
        const API_URL = "https://script.google.com/macros/s/AKfycbwV27dMi0C_456TaCtAEO08y238fYb1KGiHS8ivqdkQms90H4NBt-fca5A7vVT7UCFNTg/exec";

        // Navigation history
        let navigationHistory = [];
        let historyIndex = -1;

        // Prevent Back navigation from creating a duplicate history entry
        let isGoingBack = false;

        function updateBackButton() {
            document.getElementById("backButton").disabled =
                historyIndex <= 0;
        }

        function goBack() {
            if (historyIndex <= 0) return;

            historyIndex--;

            document.getElementById("targetUrl").value =
                navigationHistory[historyIndex];

            isGoingBack = true;
            previewHtml();
        }

        async function previewHtml() {
            const urlInput = document
                .getElementById("targetUrl")
                .value.trim();

            const iframe = document.getElementById("previewFrame");
            const statusText = document.getElementById("status");

            if (!urlInput) {
                statusText.innerText = "Enter a link.";
                isGoingBack = false;
                return;
            }

            // Add the URL to history unless we're going backward
            if (!isGoingBack) {
                if (navigationHistory[historyIndex] !== urlInput) {
                    navigationHistory = navigationHistory.slice(
                        0,
                        historyIndex + 1
                    );

                    navigationHistory.push(urlInput);
                    historyIndex = navigationHistory.length - 1;
                }
            }

            isGoingBack = false;
            updateBackButton();

            // Normalize the URL
            let normalizedUrl;

            try {
                normalizedUrl = new URL(
                    /^[a-zA-Z][a-zA-Z\d+.-]*:/.test(urlInput)
                        ? urlInput
                        : "https://" + urlInput
                );

                if (!["http:", "https:"].includes(normalizedUrl.protocol)) {
                    throw new Error("Only HTTP and HTTPS links are supported.");
                }
            } catch (error) {
                statusText.innerText = "Invalid URL.";
                return;
            }

            const finalUrl = normalizedUrl.href;

            // Keep the address bar synchronized with the normalized URL
            document.getElementById("targetUrl").value = finalUrl;

            statusText.innerText = "Loading...";
            iframe.srcdoc = "";

            try {
                const fullRequestUrl =
                    `${API_URL}?url=${encodeURIComponent(finalUrl)}`;

                const response = await fetch(fullRequestUrl);

                if (!response.ok) {
                    throw new Error(`Request failed: ${response.status}`);
                }

                let rawHtml = await response.text();

                // Set the base URL for relative links, images, and scripts
                const baseTag = `<base href="${finalUrl.replace(/"/g, "&quot;")}">`;

                if (/<head(?:\s[^>]*)?>/i.test(rawHtml)) {
                    rawHtml = rawHtml.replace(
                        /<head(?:\s[^>]*)?>/i,
                        match => match + baseTag
                    );
                } else {
                    rawHtml = `<!DOCTYPE html><html><head>${baseTag}</head><body>${rawHtml}</body></html>`;
                }

                iframe.srcdoc = rawHtml;
                statusText.innerText = "";

            } catch (error) {
                statusText.innerText = "Error loading page.";

                iframe.srcdoc = `
                    <html>
                    <body style="font-family: Arial, sans-serif; padding: 20px;">
                        <h3>Error loading preview</h3>
                        <p>${error.message}</p>
                    </body>
                    </html>
                `;
            }
        }

        // Handle links clicked inside the previewed website
        document.getElementById("previewFrame").addEventListener(
            "load",
            function () {
                const iframe = this;

                try {
                    const iframeDoc =
                        iframe.contentDocument ||
                        iframe.contentWindow.document;

                    iframeDoc.addEventListener("click", function (event) {
                        const targetLink = event.target.closest("a");

                        if (!targetLink || !targetLink.href) return;

                        // Allow new-tab and modified clicks to behave normally
                        if (
                            event.ctrlKey ||
                            event.metaKey ||
                            event.shiftKey ||
                            event.altKey ||
                            event.button !== 0 ||
                            targetLink.target === "_blank" ||
                            targetLink.hasAttribute("download")
                        ) {
                            return;
                        }

                        const linkUrl = new URL(targetLink.href);

                        if (!["http:", "https:"].includes(linkUrl.protocol)) {
                            return;
                        }

                        event.preventDefault();

                        document.getElementById("targetUrl").value =
                            linkUrl.href;

                        previewHtml();
                    });

                } catch (error) {
                    console.warn(
                        "Could not attach click listeners to the preview:",
                        error
                    );
                }
            }
        );

        // Support the browser's Backspace-independent Alt+Left shortcut
        document.addEventListener("keydown", function (event) {
            if (
                event.altKey &&
                event.key === "ArrowLeft" &&
                !event.target.matches("input, textarea")
            ) {
                event.preventDefault();
                goBack();
            }
        });
    </script>
</body>
</html>
